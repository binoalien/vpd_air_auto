name: Bug report
description: Report a problem with VPD Air Auto
title: "[Bug]: "
labels: [ "bug" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.4.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: VPD Air Auto version
      placeholder: "1.5.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
