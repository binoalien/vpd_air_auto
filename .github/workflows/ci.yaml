name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pylint
        run: pylint custom_components/vpd_air_auto tests
      - name: Pytest
        run: pytest --cov=custom_components.vpd_air_auto --cov-report=term-missing
